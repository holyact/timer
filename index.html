<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-sans);
    background: var(--color-background-primary);
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: var(--color-background-primary);
  }

  .app-card {
    background: linear-gradient(135deg, var(--color-background-secondary) 0%, var(--color-background-primary) 100%);
    border-radius: 24px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    border: 0.5px solid var(--color-border-secondary);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }

  .header {
    margin-bottom: 32px;
  }

  .app-title {
    font-size: 28px;
    font-weight: 500;
    background: linear-gradient(135deg, #185FA5 0%, #0F6E56 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--color-background-primary);
    border-radius: 16px;
    border: 0.5px solid var(--color-border-tertiary);
  }

  .volume-icon {
    font-size: 18px;
    color: #185FA5;
  }

  .volume-label {
    font-size: 13px;
    color: var(--color-text-secondary);
    font-weight: 500;
    min-width: 32px;
  }

  .volume-slider {
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: var(--color-border-tertiary);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #185FA5 0%, #0F6E56 100%);
    cursor: pointer;
    border: 2px solid var(--color-background-primary);
    box-shadow: 0 2px 8px rgba(24, 95, 165, 0.3);
  }

  .volume-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #185FA5 0%, #0F6E56 100%);
    cursor: pointer;
    border: 2px solid var(--color-background-primary);
    box-shadow: 0 2px 8px rgba(24, 95, 165, 0.3);
  }

  .volume-value {
    font-size: 13px;
    color: var(--color-text-primary);
    min-width: 32px;
    font-weight: 600;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    background: var(--color-background-primary);
    padding: 6px;
    border-radius: 14px;
    border: 0.5px solid var(--color-border-tertiary);
  }

  .tab-btn {
    flex: 1;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    background: transparent;
    border: none;
    border-radius: 12px;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .tab-btn.active {
    background: var(--color-background-secondary);
    color: #185FA5;
    box-shadow: 0 2px 8px rgba(24, 95, 165, 0.1);
  }

  .tab-btn:hover {
    color: var(--color-text-primary);
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
    animation: fadeIn 0.3s ease-out;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .title {
    font-size: 16px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-bottom: 24px;
    letter-spacing: 0.3px;
  }

  .display {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 20px;
    padding: 32px 24px;
    margin-bottom: 28px;
    transition: all 0.3s ease;
  }

  .display.pulse {
    animation: pulse-fancy 0.6s ease-out 3;
  }

  @keyframes pulse-fancy {
    0% {
      background: var(--color-background-primary);
      transform: scale(1);
    }
    50% {
      background: #FFF0F0;
      transform: scale(1.03);
      box-shadow: 0 4px 16px rgba(226, 75, 74, 0.15);
    }
    100% {
      background: var(--color-background-primary);
      transform: scale(1);
    }
  }

  .time {
    font-size: 56px;
    font-weight: 600;
    color: #185FA5;
    font-family: var(--font-mono);
    letter-spacing: 2px;
  }

  .milliseconds {
    font-size: 18px;
    color: var(--color-text-secondary);
    margin-top: 8px;
    font-weight: 500;
  }

  .input-group {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    justify-content: center;
  }

  .input-wrapper {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .time-input {
    width: 70px;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 14px;
    background: var(--color-background-primary);
    color: #185FA5;
    text-align: center;
    transition: all 0.2s ease;
  }

  .time-input:focus {
    outline: none;
    border-color: #185FA5;
    box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1);
  }

  .input-label {
    font-size: 12px;
    color: var(--color-text-secondary);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  button {
    flex: 1;
    min-width: 70px;
    padding: 13px 18px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    background: linear-gradient(135deg, #185FA5 0%, #0F6E56 100%);
    color: white;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(24, 95, 165, 0.2);
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(24, 95, 165, 0.3);
  }

  button:active:not(:disabled) {
    transform: translateY(0);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .start-btn {
    background: linear-gradient(135deg, #639922 0%, #3B6D11 100%);
    box-shadow: 0 4px 12px rgba(99, 153, 34, 0.2);
  }

  .start-btn:hover:not(:disabled) {
    box-shadow: 0 6px 16px rgba(99, 153, 34, 0.3);
  }

  .pause-btn {
    background: linear-gradient(135deg, #BA7517 0%, #854F0B 100%);
    box-shadow: 0 4px 12px rgba(186, 117, 23, 0.2);
  }

  .pause-btn:hover:not(:disabled) {
    box-shadow: 0 6px 16px rgba(186, 117, 23, 0.3);
  }

  .reset-btn {
    background: linear-gradient(135deg, #A32D2D 0%, #791F1F 100%);
    box-shadow: 0 4px 12px rgba(163, 45, 45, 0.2);
  }

  .reset-btn:hover:not(:disabled) {
    box-shadow: 0 6px 16px rgba(163, 45, 45, 0.3);
  }

  .lap-btn {
    background: linear-gradient(135deg, #185FA5 0%, #0F6E56 100%);
    width: 100%;
    margin-bottom: 20px;
    box-shadow: 0 4px 12px rgba(24, 95, 165, 0.2);
  }

  .lap-btn:hover:not(:disabled) {
    box-shadow: 0 6px 16px rgba(24, 95, 165, 0.3);
  }

  .laps {
    text-align: left;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 16px;
    padding: 18px;
    max-height: 160px;
    overflow-y: auto;
  }

  .laps-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--color-text-secondary);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .lap-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    font-size: 13px;
    color: var(--color-text-primary);
    animation: slideIn 0.3s ease-out;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(-8px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  .lap-item:last-child {
    border-bottom: none;
  }

  .lap-number {
    color: var(--color-text-secondary);
    font-weight: 500;
  }

  .lap-time {
    font-family: var(--font-mono);
    font-weight: 600;
    color: #185FA5;
  }

  .empty-laps {
    font-size: 13px;
    color: var(--color-text-secondary);
    padding: 10px 0;
  }

  .timer-status {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-bottom: 0;
    font-weight: 500;
    height: 20px;
  }

  .timer-status.finished {
    color: #A32D2D;
    font-weight: 600;
  }

  .flash-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 100, 100, 0.25);
    pointer-events: none;
    display: none;
    animation: flash-fancy 0.6s ease-out;
  }

  .flash-overlay.show {
    display: block;
  }

  @keyframes flash-fancy {
    0% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }

  ::-webkit-scrollbar {
    width: 6px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--color-border-secondary);
    border-radius: 3px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--color-border-primary);
  }
</style>
</head>
<body>

<div class="flash-overlay" id="flash-overlay"></div>

<div class="container">
  <div class="app-card">
    <div class="header">
      <div class="app-title">타이머</div>
      <div class="volume-control">
        <span class="volume-icon"><i class="ti ti-volume-2" aria-hidden="true"></i></span>
        <span class="volume-label">음량</span>
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="50">
        <span class="volume-value" id="volume-value">50%</span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="stopwatch">스톱워치</button>
      <button class="tab-btn" data-tab="timer">타이머</button>
    </div>

    <!-- 스톱워치 탭 -->
    <div id="stopwatch" class="tab-content active">
      <div class="title">스톱워치</div>

      <div class="display">
        <div class="time" id="stopwatch-display">00:00:00</div>
        <div class="milliseconds" id="stopwatch-ms">.000</div>
      </div>

      <div class="buttons">
        <button class="start-btn" id="stopwatch-start">시작</button>
        <button class="pause-btn" id="stopwatch-pause" disabled>일시정지</button>
        <button class="reset-btn" id="stopwatch-reset">초기화</button>
      </div>

      <button class="lap-btn" id="stopwatch-lap" disabled>랩 기록</button>

      <div class="laps">
        <div class="laps-title">기록</div>
        <div id="stopwatch-laps" class="empty-laps">기록이 없습니다</div>
      </div>
    </div>

    <!-- 타이머 탭 -->
    <div id="timer" class="tab-content">
      <div class="title">타이머</div>

      <div class="input-group" id="timer-inputs">
        <div class="input-wrapper">
          <input type="number" class="time-input" id="timer-minutes" placeholder="00" min="0" max="59" value="1">
          <div class="input-label">분</div>
        </div>
        <div style="display: flex; align-items: center; color: var(--color-text-secondary); font-size: 24px; font-weight: 300;">:</div>
        <div class="input-wrapper">
          <input type="number" class="time-input" id="timer-seconds" placeholder="00" min="0" max="59" value="0">
          <div class="input-label">초</div>
        </div>
      </div>

      <div class="display" id="timer-display-box">
        <div class="time" id="timer-display">01:00</div>
        <div class="timer-status" id="timer-status"></div>
      </div>

      <div class="buttons">
        <button class="start-btn" id="timer-start">시작</button>
        <button class="pause-btn" id="timer-pause" disabled>일시정지</button>
        <button class="reset-btn" id="timer-reset">초기화</button>
      </div>
    </div>
  </div>
</div>

<script>
  let volumeLevel = 0.5;

  document.getElementById('volume-slider').addEventListener('input', (e) => {
    volumeLevel = e.target.value / 100;
    document.getElementById('volume-value').textContent = e.target.value + '%';
  });

  function createBeepSound() {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const sampleRate = audioContext.sampleRate;
    const audioBuffer = audioContext.createBuffer(1, sampleRate * 0.5, sampleRate);
    const data = audioBuffer.getChannelData(0);
    
    const frequency = 1000;
    const frequency2 = 1200;
    
    for (let i = 0; i < audioBuffer.length; i++) {
      const t = i / sampleRate;
      const wave1 = Math.sin(2 * Math.PI * frequency * t);
      const wave2 = Math.sin(2 * Math.PI * frequency2 * t);
      data[i] = (wave1 + wave2) / 4;
    }
    
    return audioBuffer;
  }

  function playBeep() {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const buffer = createBeepSound();
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    
    source.buffer = buffer;
    source.connect(gain);
    gain.connect(audioContext.destination);
    
    gain.gain.setValueAtTime(0.3 * volumeLevel, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01 * volumeLevel, audioContext.currentTime + 0.5);
    
    source.start(audioContext.currentTime);
  }

  function triggerVisualEffect() {
    const displayBox = document.getElementById('timer-display-box');
    const overlay = document.getElementById('flash-overlay');
    
    displayBox.classList.remove('pulse');
    void displayBox.offsetWidth;
    displayBox.classList.add('pulse');
    
    overlay.classList.add('show');
    setTimeout(() => {
      overlay.classList.remove('show');
    }, 600);
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      e.target.classList.add('active');
      const tabId = e.target.dataset.tab;
      document.getElementById(tabId).classList.add('active');
    });
  });

  let stopwatchTime = 0;
  let stopwatchRunning = false;
  let stopwatchInterval = null;
  let stopwatchLaps = [];

  const stopwatchDisplay = document.getElementById('stopwatch-display');
  const stopwatchMs = document.getElementById('stopwatch-ms');
  const stopwatchStartBtn = document.getElementById('stopwatch-start');
  const stopwatchPauseBtn = document.getElementById('stopwatch-pause');
  const stopwatchResetBtn = document.getElementById('stopwatch-reset');
  const stopwatchLapBtn = document.getElementById('stopwatch-lap');
  const stopwatchLapList = document.getElementById('stopwatch-laps');

  function formatStopwatch(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return {
      display: `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`,
      ms: `.${String(ms % 1000).padStart(3, '0')}`
    };
  }

  function updateStopwatchDisplay() {
    const time = formatStopwatch(stopwatchTime);
    stopwatchDisplay.textContent = time.display;
    stopwatchMs.textContent = time.ms;
  }

  function startStopwatch() {
    if (!stopwatchRunning) {
      stopwatchRunning = true;
      stopwatchStartBtn.disabled = true;
      stopwatchPauseBtn.disabled = false;
      stopwatchLapBtn.disabled = false;

      const startTime = Date.now() - stopwatchTime;

      stopwatchInterval = setInterval(() => {
        stopwatchTime = Date.now() - startTime;
        updateStopwatchDisplay();
      }, 10);
    }
  }

  function pauseStopwatch() {
    if (stopwatchRunning) {
      stopwatchRunning = false;
      clearInterval(stopwatchInterval);
      stopwatchStartBtn.disabled = false;
      stopwatchPauseBtn.disabled = true;
    }
  }

  function resetStopwatch() {
    clearInterval(stopwatchInterval);
    stopwatchRunning = false;
    stopwatchTime = 0;
    stopwatchLaps = [];
    updateStopwatchDisplay();
    stopwatchStartBtn.disabled = false;
    stopwatchPauseBtn.disabled = true;
    stopwatchLapBtn.disabled = true;
    stopwatchLapList.innerHTML = '<div class="empty-laps">기록이 없습니다</div>';
  }

  function addLapStopwatch() {
    if (stopwatchRunning) {
      stopwatchLaps.push(stopwatchTime);

      let lapHTML = '';
      stopwatchLaps.forEach((lap, index) => {
        const lapFormatted = formatStopwatch(lap);
        lapHTML += `
          <div class="lap-item">
            <span class="lap-number">랩 ${index + 1}</span>
            <span class="lap-time">${lapFormatted.display}${lapFormatted.ms}</span>
          </div>
        `;
      });

      stopwatchLapList.innerHTML = lapHTML;
    }
  }

  stopwatchStartBtn.addEventListener('click', startStopwatch);
  stopwatchPauseBtn.addEventListener('click', pauseStopwatch);
  stopwatchResetBtn.addEventListener('click', resetStopwatch);
  stopwatchLapBtn.addEventListener('click', addLapStopwatch);

  let timerTotal = 60000;
  let timerRemaining = 60000;
  let timerRunning = false;
  let timerInterval = null;

  const timerMinutesInput = document.getElementById('timer-minutes');
  const timerSecondsInput = document.getElementById('timer-seconds');
  const timerDisplay = document.getElementById('timer-display');
  const timerStatus = document.getElementById('timer-status');
  const timerStartBtn = document.getElementById('timer-start');
  const timerPauseBtn = document.getElementById('timer-pause');
  const timerResetBtn = document.getElementById('timer-reset');
  const timerInputs = document.getElementById('timer-inputs');

  function formatTimer(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  }

  function updateTimerDisplay() {
    timerDisplay.textContent = formatTimer(timerRemaining);
  }

  function setTimerFromInputs() {
    const minutes = parseInt(timerMinutesInput.value) || 0;
    const seconds = parseInt(timerSecondsInput.value) || 0;
    timerTotal = (minutes * 60 + seconds) * 1000;
    timerRemaining = timerTotal;
    updateTimerDisplay();
    timerStatus.textContent = '';
    timerStatus.classList.remove('finished');
  }

  function startTimer() {
    if (!timerRunning && timerRemaining > 0) {
      timerRunning = true;
      timerStartBtn.disabled = true;
      timerPauseBtn.disabled = false;
      timerInputs.style.opacity = '0.5';
      timerInputs.style.pointerEvents = 'none';

      const startTime = Date.now();
      const startRemaining = timerRemaining;

      timerInterval = setInterval(() => {
        timerRemaining = startRemaining - (Date.now() - startTime);

        if (timerRemaining <= 0) {
          timerRemaining = 0;
          clearInterval(timerInterval);
          timerRunning = false;
          timerStartBtn.disabled = false;
          timerPauseBtn.disabled = true;
          timerStatus.textContent = '완료!';
          timerStatus.classList.add('finished');
          updateTimerDisplay();
          
          triggerVisualEffect();
          playBeep();
          setTimeout(() => playBeep(), 300);
          setTimeout(() => playBeep(), 600);
        } else {
          updateTimerDisplay();
        }
      }, 100);
    }
  }

  function pauseTimer() {
    if (timerRunning) {
      timerRunning = false;
      clearInterval(timerInterval);
      timerStartBtn.disabled = false;
      timerPauseBtn.disabled = true;
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    setTimerFromInputs();
    timerStartBtn.disabled = false;
    timerPauseBtn.disabled = true;
    timerInputs.style.opacity = '1';
    timerInputs.style.pointerEvents = 'auto';
    timerStatus.textContent = '';
    timerStatus.classList.remove('finished');
  }

  timerMinutesInput.addEventListener('change', setTimerFromInputs);
  timerSecondsInput.addEventListener('change', setTimerFromInputs);
  timerStartBtn.addEventListener('click', startTimer);
  timerPauseBtn.addEventListener('click', pauseTimer);
  timerResetBtn.addEventListener('click', resetTimer);
</script>

</body>
</html>
