<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타이머 & 스톱워치</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .app-card {
            background: linear-gradient(135deg, #1a1f2e 0%, #16192a 100%);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .app-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #185FA5 0%, #0F6E56 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .volume-icon {
            font-size: 18px;
            color: #64b5f6;
            width: 24px;
            text-align: center;
        }

        .volume-label {
            font-size: 13px;
            color: #b0b0b0;
            font-weight: 600;
            min-width: 32px;
        }

        .volume-slider {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            cursor: pointer;
            border: 2px solid #1a1f2e;
            box-shadow: 0 2px 8px rgba(100, 181, 246, 0.4);
        }

        .volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            cursor: pointer;
            border: 2px solid #1a1f2e;
            box-shadow: 0 2px 8px rgba(100, 181, 246, 0.4);
        }

        .volume-value {
            font-size: 13px;
            color: #e0e0e0;
            min-width: 35px;
            font-weight: 700;
            text-align: right;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            border: none;
            border-radius: 14px;
            color: #9e9e9e;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: none;
        }

        .tab-btn.active {
            background: rgba(100, 181, 246, 0.15);
            color: #64b5f6;
            box-shadow: 0 2px 8px rgba(100, 181, 246, 0.15);
            border: 1px solid rgba(100, 181, 246, 0.3);
        }

        .tab-btn:hover {
            color: #e0e0e0;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .display {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.04) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 36px 24px;
            margin-bottom: 28px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .display.pulse {
            animation: pulse-fancy 0.6s ease-out 3;
        }

        @keyframes pulse-fancy {
            0% {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.04) 100%);
                transform: scale(1);
            }
            50% {
                background: linear-gradient(135deg, rgba(229, 57, 53, 0.15) 0%, rgba(229, 57, 53, 0.08) 100%);
                transform: scale(1.03);
                box-shadow: 0 4px 16px rgba(229, 57, 53, 0.25);
            }
            100% {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.04) 100%);
                transform: scale(1);
            }
        }

        .time {
            font-size: 48px;
            font-weight: 700;
            color: #64b5f6;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            line-height: 1;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .milliseconds {
            font-size: 18px;
            color: #9e9e9e;
            margin-top: 10px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
            align-items: flex-end;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .time-input {
            width: 75px;
            padding: 13px;
            font-size: 18px;
            font-weight: 700;
            border: 1px solid rgba(100, 181, 246, 0.3);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #64b5f6;
            text-align: center;
            transition: all 0.2s ease;
        }

        .time-input:focus {
            outline: none;
            border-color: #64b5f6;
            box-shadow: 0 0 0 3px rgba(100, 181, 246, 0.15);
            background: rgba(100, 181, 246, 0.08);
        }

        .input-label {
            font-size: 12px;
            color: #9e9e9e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .separator {
            display: flex;
            align-items: center;
            color: #555;
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 8px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 85px;
            padding: 13px 16px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            color: #0f1419;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(100, 181, 246, 0.25);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(100, 181, 246, 0.35);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .start-btn {
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
            box-shadow: 0 4px 12px rgba(102, 187, 106, 0.25);
        }

        .start-btn:hover:not(:disabled) {
            box-shadow: 0 6px 16px rgba(102, 187, 106, 0.35);
        }

        .pause-btn {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
            box-shadow: 0 4px 12px rgba(255, 167, 38, 0.25);
        }

        .pause-btn:hover:not(:disabled) {
            box-shadow: 0 6px 16px rgba(255, 167, 38, 0.35);
        }

        .reset-btn {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
            box-shadow: 0 4px 12px rgba(239, 83, 80, 0.25);
        }

        .reset-btn:hover:not(:disabled) {
            box-shadow: 0 6px 16px rgba(239, 83, 80, 0.35);
        }

        .lap-btn {
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(100, 181, 246, 0.25);
        }

        .lap-btn:hover:not(:disabled) {
            box-shadow: 0 6px 16px rgba(100, 181, 246, 0.35);
        }

        .laps {
            text-align: left;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.04) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 18px;
            max-height: 160px;
            overflow-y: auto;
        }

        .laps-title {
            font-size: 11px;
            font-weight: 700;
            color: #9e9e9e;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: #e0e0e0;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .lap-item:last-child {
            border-bottom: none;
        }

        .lap-number {
            color: #9e9e9e;
            font-weight: 600;
        }

        .lap-time {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: #64b5f6;
        }

        .empty-laps {
            font-size: 13px;
            color: #666;
            padding: 10px 0;
        }

        .timer-status {
            font-size: 13px;
            color: #9e9e9e;
            margin-top: 8px;
            font-weight: 600;
            height: 20px;
        }

        .timer-status.finished {
            color: #ef5350;
            font-weight: 700;
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 100, 100, 0.25);
            pointer-events: none;
            display: none;
            animation: flash-fancy 0.6s ease-out;
            z-index: 9999;
        }

        .flash-overlay.show {
            display: block;
        }

        @keyframes flash-fancy {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="flash-overlay" id="flash-overlay"></div>

<div class="container">
    <div class="app-card">
        <div class="header">
            <div class="app-title">타이머</div>
            <div class="volume-control">
                <div class="volume-icon">🔊</div>
                <span class="volume-label">음량</span>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="50">
                <span class="volume-value" id="volume-value">50%</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="stopwatch">스톱워치</button>
            <button class="tab-btn" data-tab="timer">타이머</button>
        </div>

        <!-- 스톱워치 탭 -->
        <div id="stopwatch" class="tab-content active">
            <div class="title">스톱워치</div>

            <div class="display">
                <div class="time" id="stopwatch-display">00:00:00</div>
                <div class="milliseconds" id="stopwatch-ms">.000</div>
            </div>

            <div class="buttons">
                <button class="start-btn" id="stopwatch-start">시작</button>
                <button class="pause-btn" id="stopwatch-pause" disabled>일시정지</button>
                <button class="reset-btn" id="stopwatch-reset">초기화</button>
            </div>

            <button class="lap-btn" id="stopwatch-lap" disabled>랩 기록</button>

            <div class="laps">
                <div class="laps-title">기록</div>
                <div id="stopwatch-laps" class="empty-laps">기록이 없습니다</div>
            </div>
        </div>

        <!-- 타이머 탭 -->
        <div id="timer" class="tab-content">
            <div class="title">타이머</div>

            <div class="input-group" id="timer-inputs">
                <div class="input-wrapper">
                    <input type="number" class="time-input" id="timer-minutes" min="0" max="59" value="1">
                    <div class="input-label">분</div>
                </div>
                <div class="separator">:</div>
                <div class="input-wrapper">
                    <input type="number" class="time-input" id="timer-seconds" min="0" max="59" value="0">
                    <div class="input-label">초</div>
                </div>
            </div>

            <div class="display" id="timer-display-box">
                <div class="time" id="timer-display">01:00</div>
                <div class="timer-status" id="timer-status"></div>
            </div>

            <div class="buttons">
                <button class="start-btn" id="timer-start">시작</button>
                <button class="pause-btn" id="timer-pause" disabled>일시정지</button>
                <button class="reset-btn" id="timer-reset">초기화</button>
            </div>
        </div>
    </div>
</div>

<script>
    let volumeLevel = 0.5;

    document.getElementById('volume-slider').addEventListener('input', (e) => {
        volumeLevel = e.target.value / 100;
        document.getElementById('volume-value').textContent = e.target.value + '%';
    });

    function createBeepSound() {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const sampleRate = audioContext.sampleRate;
        const audioBuffer = audioContext.createBuffer(1, sampleRate * 0.5, sampleRate);
        const data = audioBuffer.getChannelData(0);
        
        const frequency = 1000;
        const frequency2 = 1200;
        
        for (let i = 0; i < audioBuffer.length; i++) {
            const t = i / sampleRate;
            const wave1 = Math.sin(2 * Math.PI * frequency * t);
            const wave2 = Math.sin(2 * Math.PI * frequency2 * t);
            data[i] = (wave1 + wave2) / 4;
        }
        
        return audioBuffer;
    }

    function playBeep() {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const buffer = createBeepSound();
        const source = audioContext.createBufferSource();
        const gain = audioContext.createGain();
        
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(audioContext.destination);
        
        gain.gain.setValueAtTime(0.3 * volumeLevel, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01 * volumeLevel, audioContext.currentTime + 0.5);
        
        source.start(audioContext.currentTime);
    }

    function triggerVisualEffect() {
        const displayBox = document.getElementById('timer-display-box');
        const overlay = document.getElementById('flash-overlay');
        
        displayBox.classList.remove('pulse');
        void displayBox.offsetWidth;
        displayBox.classList.add('pulse');
        
        overlay.classList.add('show');
        setTimeout(() => {
            overlay.classList.remove('show');
        }, 600);
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            e.target.classList.add('active');
            const tabId = e.target.dataset.tab;
            document.getElementById(tabId).classList.add('active');
        });
    });

    let stopwatchTime = 0;
    let stopwatchRunning = false;
    let stopwatchInterval = null;
    let stopwatchLaps = [];

    const stopwatchDisplay = document.getElementById('stopwatch-display');
    const stopwatchMs = document.getElementById('stopwatch-ms');
    const stopwatchStartBtn = document.getElementById('stopwatch-start');
    const stopwatchPauseBtn = document.getElementById('stopwatch-pause');
    const stopwatchResetBtn = document.getElementById('stopwatch-reset');
    const stopwatchLapBtn = document.getElementById('stopwatch-lap');
    const stopwatchLapList = document.getElementById('stopwatch-laps');

    function formatStopwatch(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        return {
            display: `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`,
            ms: `.${String(ms % 1000).padStart(3, '0')}`
        };
    }

    function updateStopwatchDisplay() {
        const time = formatStopwatch(stopwatchTime);
        stopwatchDisplay.textContent = time.display;
        stopwatchMs.textContent = time.ms;
    }

    function startStopwatch() {
        if (!stopwatchRunning) {
            stopwatchRunning = true;
            stopwatchStartBtn.disabled = true;
            stopwatchPauseBtn.disabled = false;
            stopwatchLapBtn.disabled = false;

            const startTime = Date.now() - stopwatchTime;

            stopwatchInterval = setInterval(() => {
                stopwatchTime = Date.now() - startTime;
                updateStopwatchDisplay();
            }, 10);
        }
    }

    function pauseStopwatch() {
        if (stopwatchRunning) {
            stopwatchRunning = false;
            clearInterval(stopwatchInterval);
            stopwatchStartBtn.disabled = false;
            stopwatchPauseBtn.disabled = true;
        }
    }

    function resetStopwatch() {
        clearInterval(stopwatchInterval);
        stopwatchRunning = false;
        stopwatchTime = 0;
        stopwatchLaps = [];
        updateStopwatchDisplay();
        stopwatchStartBtn.disabled = false;
        stopwatchPauseBtn.disabled = true;
        stopwatchLapBtn.disabled = true;
        stopwatchLapList.innerHTML = '<div class="empty-laps">기록이 없습니다</div>';
    }

    function addLapStopwatch() {
        if (stopwatchRunning) {
            stopwatchLaps.push(stopwatchTime);

            let lapHTML = '';
            stopwatchLaps.forEach((lap, index) => {
                const lapFormatted = formatStopwatch(lap);
                lapHTML += `
                    <div class="lap-item">
                        <span class="lap-number">랩 ${index + 1}</span>
                        <span class="lap-time">${lapFormatted.display}${lapFormatted.ms}</span>
                    </div>
                `;
            });

            stopwatchLapList.innerHTML = lapHTML;
        }
    }

    stopwatchStartBtn.addEventListener('click', startStopwatch);
    stopwatchPauseBtn.addEventListener('click', pauseStopwatch);
    stopwatchResetBtn.addEventListener('click', resetStopwatch);
    stopwatchLapBtn.addEventListener('click', addLapStopwatch);

    let timerTotal = 60000;
    let timerRemaining = 60000;
    let timerRunning = false;
    let timerInterval = null;

    const timerMinutesInput = document.getElementById('timer-minutes');
    const timerSecondsInput = document.getElementById('timer-seconds');
    const timerDisplay = document.getElementById('timer-display');
    const timerStatus = document.getElementById('timer-status');
    const timerStartBtn = document.getElementById('timer-start');
    const timerPauseBtn = document.getElementById('timer-pause');
    const timerResetBtn = document.getElementById('timer-reset');
    const timerInputs = document.getElementById('timer-inputs');

    function formatTimer(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updateTimerDisplay() {
        timerDisplay.textContent = formatTimer(timerRemaining);
    }

    function setTimerFromInputs() {
        const minutes = parseInt(timerMinutesInput.value) || 0;
        const seconds = parseInt(timerSecondsInput.value) || 0;
        timerTotal = (minutes * 60 + seconds) * 1000;
        timerRemaining = timerTotal;
        updateTimerDisplay();
        timerStatus.textContent = '';
        timerStatus.classList.remove('finished');
    }

    function startTimer() {
        if (!timerRunning && timerRemaining > 0) {
            timerRunning = true;
            timerStartBtn.disabled = true;
            timerPauseBtn.disabled = false;
            timerInputs.style.opacity = '0.5';
            timerInputs.style.pointerEvents = 'none';

            const startTime = Date.now();
            const startRemaining = timerRemaining;

            timerInterval = setInterval(() => {
                timerRemaining = startRemaining - (Date.now() - startTime);

                if (timerRemaining <= 0) {
                    timerRemaining = 0;
                    clearInterval(timerInterval);
                    timerRunning = false;
                    timerStartBtn.disabled = false;
                    timerPauseBtn.disabled = true;
                    timerStatus.textContent = '완료!';
                    timerStatus.classList.add('finished');
                    updateTimerDisplay();
                    
                    triggerVisualEffect();
                    playBeep();
                    setTimeout(() => playBeep(), 300);
                    setTimeout(() => playBeep(), 600);
                } else {
                    updateTimerDisplay();
                }
            }, 100);
        }
    }

    function pauseTimer() {
        if (timerRunning) {
            timerRunning = false;
            clearInterval(timerInterval);
            timerStartBtn.disabled = false;
            timerPauseBtn.disabled = true;
        }
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerRunning = false;
        setTimerFromInputs();
        timerStartBtn.disabled = false;
        timerPauseBtn.disabled = true;
        timerInputs.style.opacity = '1';
        timerInputs.style.pointerEvents = 'auto';
        timerStatus.textContent = '';
        timerStatus.classList.remove('finished');
    }

    timerMinutesInput.addEventListener('change', setTimerFromInputs);
    timerSecondsInput.addEventListener('change', setTimerFromInputs);
    timerStartBtn.addEventListener('click', startTimer);
    timerPauseBtn.addEventListener('click', pauseTimer);
    timerResetBtn.addEventListener('click', resetTimer);
</script>

</body>
</html>
